name: Windows build

# Windows binaries cannot be built or tested on the maintainer's machine
# (Linux only), so CI is the feedback loop for the Windows port. Runs on
# demand; it is not cheap (Windows runners bill at 2x).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the release asset (default: build only)'
        type: boolean
        default: false
      pgo:
        description: 'Runtime PGO: auto (use the committed profile if present), none, or instrument (build the training exe)'
        type: choice
        options: [auto, none, instrument]
        default: auto
# DISPATCH ONLY, since 2026-09-08. There is no `push:` trigger any more, for
# the same reason deck.yml lost its one on 2026-08-17 -- and this job is worse
# on every axis that mattered there.
#
# The old filter matched 'ModernGekko/**' and 'DolRecomp/**', which is nearly
# every commit that touches the runtime, and a windows-2022 runner bills at 2x
# against 2,000 included minutes a month on a private repo. August was already
# exhausted once that way (~2,312 minutes), which is what took the Deck job
# down and left it failing in three seconds with no runner assigned. Merging
# the Windows branch fired this twice in one afternoon by itself.
#
# The Linux and Deck checks that used to justify a push trigger already run in
# .githooks/pre-push, on the debian:12 container, before anything leaves the
# machine. Nothing equivalent exists for MSVC -- so run this deliberately, when
# a Windows answer is actually wanted, rather than on every runtime commit.

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Choose PGO mode
        # MSVC PGO rides on LTO (/GL + /LTCG, below). Three modes:
        # Both profile flags need /LTCG spelled out on the link line (LNK1220):
        # CMake's IPO sets it as a project property, which the linker does not
        # count, so it is passed again here.
        #   instrument  link with /GENPROFILE; the exe writes .pgc counts when
        #               it exits. Published under its OWN asset name with the
        #               .pgd and pgort140.dll it needs, never as the binaries.
        #   auto        if ModernGekko/pgo/runtime-windows/profile.7z exists,
        #               unpack it, merge its .pgc files into its .pgd (pgomgr)
        #               and link with /USEPROFILE; otherwise plain LTO.
        #   none        plain LTO.
        # A .pgd is tied to the MSVC toolset that made it (LNK1266 on another),
        # so the instrument run records the toolset in toolset.txt (packed into
        # the archive with the profile) and a
        # profiled build pins -T to it. A runner image without that toolset
        # falls back to plain LTO with a warning instead of failing.
        #
        # TRAIN WINDOWED WITH D3D11, not headless: MSVC compiles every function
        # the training never ran for SIZE, and GCC's -fprofile-partial-training
        # has no MSVC equivalent. A headless (Null renderer) profile would make
        # the renderer players actually use slower.
        id: pgo
        shell: pwsh
        run: |
          $mode = '${{ inputs.pgo }}'; if (-not $mode) { $mode = 'auto' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $prof = 'ModernGekko/pgo/runtime-windows'
          $link = ''; $toolset = ''
          if ($mode -eq 'instrument') {
            $link = '/LTCG /GENPROFILE'
            $toolset = (Get-ChildItem "$vs\VC\Tools\MSVC" | Sort-Object Name | Select-Object -Last 1).Name
          } elseif ($mode -eq 'auto' -and (Test-Path "$prof/profile.7z")) {
            # One 7z (.pgd, the training .pgc files, toolset.txt): 112 MB raw,
            # ~12 MB committed. 7-Zip, not tar: a tar -xJf here hung the job
            # silently for 50 minutes (run 36649768296). Every stage says what
            # it is doing, and pgomgr runs with no stdin and a time limit.
            New-Item -ItemType Directory -Force pgo-work | Out-Null
            Write-Output "unpacking $prof/profile.7z"
            7z x -y -bd -opgo-work "$prof/profile.7z" | Out-Null
            if ($LASTEXITCODE) { throw 'could not unpack the PGO profile' }
            Get-ChildItem pgo-work | ForEach-Object { Write-Output "  $($_.Name) $($_.Length)" }
            $want = (Get-Content pgo-work/toolset.txt -Raw).Trim()
            $tools = "$vs\VC\Tools\MSVC\$want"
            if (Test-Path $tools) {
              $pgomgr = "$tools\bin\Hostx64\x64\pgomgr.exe"
              $pgd = (Resolve-Path pgo-work\moderngekko-run.pgd).Path
              # An empty file for stdin: Start-Process will not take NUL.
              New-Item -ItemType File -Force pgo-work\empty-stdin.txt | Out-Null
              Get-ChildItem pgo-work -Filter *.pgc | ForEach-Object {
                Write-Output "merging $($_.Name)"
                $p = Start-Process -FilePath $pgomgr -ArgumentList '/merge', "`"$($_.FullName)`"", "`"$pgd`"" `
                       -NoNewWindow -PassThru -RedirectStandardInput "pgo-work\empty-stdin.txt" -RedirectStandardOutput "pgo-work\merge.log"
                if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "pgomgr timed out on $($_.Name)" }
                Get-Content pgo-work\merge.log | ForEach-Object { Write-Output "  $_" }
                if ($p.ExitCode) { throw "pgomgr failed on $($_.Name) (exit $($p.ExitCode))" }
              }
              $link = "/LTCG /USEPROFILE:PGD=$((Resolve-Path pgo-work\moderngekko-run.pgd).Path)"
              $toolset = $want; $mode = 'use'
            } else {
              Write-Output "::warning::PGO profile needs MSVC $want, which this runner lacks -- building plain LTO. Retrain."
              $mode = 'none'
            }
          } else { $mode = 'none' }
          "mode=$mode" >> $env:GITHUB_OUTPUT
          "link=$link" >> $env:GITHUB_OUTPUT
          "toolset=$toolset" >> $env:GITHUB_OUTPUT
          Write-Output "PGO mode: $mode  toolset: $toolset  link: $link"

      - name: Configure
        # Dolphin's own CMake drives the vendored tree. Qt and the tests are the
        # two things that pull in toolchain we do not have on the runner, and the
        # runtime is headless-capable, so both are off.
        # ENABLE_LTO: CMake IPO, i.e. /GL + /LTCG under MSVC. On Linux the same
        # flag took -2.70% of all CPU cycles on the Steam Deck (build-deck.sh);
        # on Windows, -2.16% (the test laptop, 16000 frames of the arcade route,
        # n=5 each, ranges not overlapping, frame hash unchanged -- PR #61).
        # /wd5049: under /GL, MSVC warns that the precompiled header embeds a full
        # path (C5049), and Dolphin's PCH target builds with /WX, so the warning
        # stopped the build. _INIT appends to MSVC's defaults; setting
        # CMAKE_CXX_FLAGS itself would replace them and drop /EHsc.
        # -T pins the MSVC toolset only when a profile is involved (see above).
        # The PGO link flag goes to the runtime target alone
        # (MODERNGEKKO_RUNTIME_LINK_FLAGS, ModernGekko/CMakeLists.txt), never
        # to every link: dolrecomp is built in the same tree.
        shell: pwsh
        run: |
          $t = '${{ steps.pgo.outputs.toolset }}'
          $ts = if ($t) { @('-T', "v143,version=$t") } else { @() }
          cmake -S ModernGekko -B build -G "Visual Studio 17 2022" -A x64 @ts `
            -DENABLE_LTO=ON "-DCMAKE_CXX_FLAGS_INIT=/wd5049" `
            "-DMODERNGEKKO_RUNTIME_LINK_FLAGS=${{ steps.pgo.outputs.link }}" `
            -DENABLE_QT=OFF -DENABLE_TESTS=OFF -DENABLE_ANALYTICS=OFF -DENABLE_AUTOUPDATE=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build runtime
        run: cmake --build build --config Release --target moderngekko-run

      - name: Build recompiler
        run: cmake --build build --config Release --target dolrecomp

      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Get-ChildItem -Path build -Recurse -Include moderngekko-run.exe,dolrecomp.exe |
            ForEach-Object { Copy-Item $_.FullName staging/ }
          Get-ChildItem staging

      - name: Publish PGO training kit
        # The instrumented exe, the .pgd its counts belong to, the PGO runtime
        # DLL it loads, and the toolset it was built with. Its own asset name:
        # it must never overwrite the real binaries.
        if: github.event_name == 'workflow_dispatch' && inputs.publish && steps.pgo.outputs.mode == 'instrument'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $t = '${{ steps.pgo.outputs.toolset }}'
          New-Item -ItemType Directory -Force pgo-kit | Out-Null
          Copy-Item staging/moderngekko-run.exe pgo-kit/
          Get-ChildItem build -Recurse -Filter moderngekko-run.pgd | Select-Object -First 1 | Copy-Item -Destination pgo-kit/
          Copy-Item "$vs\VC\Tools\MSVC\$t\bin\Hostx64\x64\pgort140.dll" pgo-kit/
          Set-Content pgo-kit/toolset.txt $t
          if (-not (Test-Path pgo-kit/moderngekko-run.pgd)) { throw 'no .pgd produced' }
          Get-ChildItem pgo-kit
          7z a -tzip RingOut-windows-x64-pgo-instrument.zip ./pgo-kit/* > $null
          gh release view windows-latest *> $null
          if ($LASTEXITCODE) { gh release create windows-latest --prerelease --title "Windows build (rolling)" --notes "Built from $env:GITHUB_SHA." --target $env:GITHUB_SHA }
          gh release upload windows-latest RingOut-windows-x64-pgo-instrument.zip --clobber

      - name: Publish binaries
        # Was an Actions artifact uploaded on EVERY push, which is what kept the
        # shared quota full and failed unrelated workflows' uploads. Same rolling
        # release as the bundle, so there is always a current Windows build with
        # a stable URL and nothing accumulating behind it.
        #
        # Uploading is now opt-in, via the dispatch's publish input. A push no
        # longer publishes by itself: "this built" and "everyone downloads this"
        # were the same event, and there was no way to exercise the workflow
        # without shipping the result.
        if: github.event_name == 'workflow_dispatch' && inputs.publish && steps.pgo.outputs.mode != 'instrument'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          7z a -tzip RingOut-windows-x64-binaries.zip ./staging/* > /dev/null
          gh release view windows-latest >/dev/null 2>&1 || \
            gh release create windows-latest --prerelease --title "Windows build (rolling)" \
              --notes "Built from ${GITHUB_SHA}." --target "$GITHUB_SHA"
          gh release upload windows-latest RingOut-windows-x64-binaries.zip --clobber

      # The release bundle carries a whole toolchain, so it is assembled here
      # rather than on a developer machine: llvm-mingw alone unpacks to ~2 GB.
      #
      # Only on demand or for a tag. At ~294 MB it is 59% of this private repo's
      # 500 MB artifact allowance ON ITS OWN, so uploading one per push cannot
      # fit however short the retention -- two pushes refill the quota, and the
      # upload that then fails is whichever workflow happens to finish next.
      # That is how the Steam Deck build started failing for a Windows reason.
      # The per-push value here is the binaries, which are 6 MB and still
      # uploaded every time.
      - name: Package release
        # Always on a manual run, publish or not: this is the only way
        # package-windows.ps1 ever gets exercised.
        if: github.event_name == 'workflow_dispatch' && steps.pgo.outputs.mode != 'instrument'
        shell: pwsh
        run: |
          .github/scripts/package-windows.ps1 `
            -BinDir staging -RepoRoot (Get-Location).Path -OutDir package

      - name: Publish release asset
        # (Never for an instrumented build: see "Publish PGO training kit".)
        # OPT-IN ONLY: a dispatch with publish=true. An earlier attempt gated
        # this on a tag ref, which was wrong -- this workflow has no tag trigger,
        # so that condition could never be true and the asset would never have
        # published at all. Do not reintroduce a tag gate without also adding
        # tags to `on.push`, and note that `paths` filters apply to tag pushes
        # too, so a tag on an existing commit usually matches nothing and the
        # run is skipped entirely.
        if: github.event_name == 'workflow_dispatch' && inputs.publish && steps.pgo.outputs.mode != 'instrument'
        # A GitHub RELEASE asset, not an Actions artifact. This bundle is ~294 MB
        # per build because it carries a whole toolchain, and at the 90-day
        # artifact default it exhausted the repo's shared artifact quota -- which
        # does not fail only the big upload, it fails EVERY workflow's uploads,
        # including the 22 MB Deck package. Release assets are outside that pool
        # and give a stable download URL.
        #
        # --clobber because re-uploading an existing asset name is an error,
        # not a replace.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"; title="Ring Out $tag (Windows)"; extra=""
          else
            tag="windows-latest"; title="Windows build (rolling)"; extra="--prerelease"
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" $extra --title "$title" \
              --notes "Built from ${GITHUB_SHA}." --target "$GITHUB_SHA"
          # Glob, not a hardcoded 1.0: package-windows.ps1 names these from the
          # VERSION file now (559ee1eb), so naming them here as well would put
          # the version in a third place and break the upload the moment they
          # disagree -- which they already did.
          shopt -s nullglob
          assets=(package/RingOut-*-windows-x64-setup.exe package/RingOut-*-windows-x64.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no package artifacts to upload; package/ holds:" >&2
            ls -la package >&2 || true
            exit 1
          fi
          printf 'uploading: %s\n' "${assets[@]}"
          gh release upload "$tag" "${assets[@]}" --clobber

      # A failed configure/build leaves the useful detail in these logs rather
      # than in the step output.
      - name: Upload CMake logs on failure
        if: failure()
        # continue-on-error: this is diagnostics. When the artifact quota is full
        # this upload fails too, and a FAILED upload of failure logs was itself
        # being reported as the job's failure -- hiding the real one underneath.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cmake-logs
          retention-days: 7
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
          if-no-files-found: ignore
