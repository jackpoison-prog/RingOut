# GRSEAF - SOULCALIBUR2 (USA)
#
# Dolphin ships only GRSPAF.ini (the PAL release), so the USA disc matched no
# game ini and the menu's CHEATS tab came up empty.  These are the USA codes in
# CodeJunkies encrypted form; Dolphin decrypts them on load (ActionReplay.cpp
# LoadCodes -> DecryptARCode), so do NOT paste the PAL hex here -- PAL addresses
# point at unrelated memory in this build.
#
# The Action Replay "master code" (ZNKR-J50V-BV1NH / 2MXM-TPTG-U7B4G) is a real
# hardware requirement only; Dolphin does not need it and it is left out.
#
# Codes are listed but NOT enabled by default -- turn on what you want from the
# CHEATS tab (Escape menu).

