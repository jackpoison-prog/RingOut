# GRSJAF - SOULCALIBUR2 (Japan)
#
# Dolphin ships no Japanese ini for this game and this project had none, so a
# Japanese disc came up with an empty CHEATS tab while the US and PAL discs had
# lists. These are the Japanese codes in CodeJunkies encrypted form; Dolphin
# decrypts them on load (ActionReplay.cpp LoadCodes -> DecryptARCode).
#
# DO NOT PASTE USA CODES HERE. A list circulating as "Japanese" was the USA list
# relabelled, and it is not harmless: enabled on this build it writes live state
# from frame 1, on variables 0x5C800 away from the ones its labels name. The two
# builds' bss differ by exactly that much (USA 0x802B4B80, Japan 0x80311380).
#
# How these were checked before shipping:
#   * every code decrypts, and every address it writes lands in a real region of
#     the JAPANESE executable -- text, data or bss -- not the USA one
#   * the master code hooks 0x8001BE58; the USA master hooks 0x8018C6D0, over
#     1.5 MB away. Codes for the same build cannot differ like that
#   * P1 Infinite Health writes 0x43700000 (240.0f, the same value the USA code
#     uses) to bss +0x9A15C, where the USA equivalent is bss +0x99E9C -- the same
#     variable in a layout shifted by 0x5C800
#   * 99999900 Gold writes 0x05F5E09C, which is exactly 99,999,900
#   * VERIFIED RUNNING: with P1 Infinite Health enabled, Talim's health bar
#     stays full through a live Stage 1 fight while Taki takes damage
#
# Codes are listed but NOT enabled by default -- turn on what you want from the
# CHEATS tab (Escape menu).

